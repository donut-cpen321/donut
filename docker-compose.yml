# Requires Docker Compose v2.24+ for the `env_file: required:` syntax below.

name: cpen321-project

services:
  backend:
    build: ./backend
    # Published on all interfaces so a physical Android device on the same Wi-Fi
    # can reach it. Emulators use http://10.0.2.2:3000/api/ either way.
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
    environment:
      DATABASE_URL: postgresql://donut:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ./.env}@postgres:5432/donut
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: donut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ./.env}
      POSTGRES_DB: donut
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "donut"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  postgres-data:
