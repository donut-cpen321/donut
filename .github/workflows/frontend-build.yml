name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Matches the pinned toolchain (jvmToolchain(17) and gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies and validates the wrapper jar
      - uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored, so CI builds with the defaults in
      # app/build.gradle.kts (empty API keys). The Android SDK comes from the
      # runner's ANDROID_HOME. The androidTest APK is built too, so the
      # instrumented tests still have to compile even though CI cannot run them.
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
