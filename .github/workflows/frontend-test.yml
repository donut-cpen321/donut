name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Matches the pinned toolchain (jvmToolchain(17) and gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle dependencies and validates the wrapper jar
      - uses: gradle/actions/setup-gradle@v4

      # Local JVM unit tests only (app/src/test). The instrumented tests in
      # app/src/androidTest need a signed-in emulator, so they are compiled
      # by the Frontend Build workflow but not run here.
      - run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-report
          path: frontend/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
