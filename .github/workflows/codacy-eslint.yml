name: Codacy ESLint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - uses: codacy/codacy-cli-v2-action@main
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          tool: eslint
          upload_report: true
