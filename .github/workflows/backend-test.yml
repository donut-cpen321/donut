name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Real database for the no-mock tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: donut
          POSTGRES_PASSWORD: donut
          POSTGRES_DB: donut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donut"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://donut:donut@localhost:5432/donut

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run generate

      - run: npx prisma migrate deploy

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore
